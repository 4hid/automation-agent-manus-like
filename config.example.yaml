# Automation Agent Configuration - Manus AI Inspired

agent:
  # Autonomous operation settings (Manus AI-like)
  autonomous_mode: true
  max_iterations: 50
  error_recovery: true
  retry_attempts: 3
  
  # Asynchronous processing (Manus AI feature)
  asynchronous_execution: true
  background_processing: true
  persist_state: true
  
  # Quality assurance settings
  verification_enabled: true
  validation_threshold: 0.8
  gaia_benchmark_mode: false
  
  # Memory and performance settings
  max_memory_tokens: 12000
  conversation_truncation: true
  parallel_execution: true
  max_concurrent_tasks: 3
  
  # Adaptive learning (Manus AI feature)
  adaptive_learning: true
  personalization: true
  optimization_enabled: true

# Tool-specific configurations
tools:
  research:
    max_sources: 15
    fact_check: true
    search_engines: ["google", "bing", "duckduckgo", "scholar"]
    max_depth: 5
    real_time_access: true
    multi_modal_search: true
    
  content_creation:
    output_format: "markdown"
    include_citations: true
    grammar_check: true
    plagiarism_check: true
    multi_modal_generation: true
    template_library: true
    
  task_planner:
    max_subtasks: 100
    dependency_analysis: true
    resource_estimation: true
    timeline_generation: true
    adaptive_planning: true
    gaia_optimization: true
    
  workflow_orchestrator:
    parallel_tasks: 5
    timeout_minutes: 120
    checkpoint_frequency: 3
    rollback_enabled: true
    asynchronous_mode: true
    state_persistence: true
    
  verification:
    automated_testing: true
    quality_metrics: true
    performance_benchmarks: true
    security_scan: true
    gaia_evaluation: true
    multi_modal_validation: true

# Multi-modal capabilities (Manus AI feature)
multi_modal:
  text_processing: true
  image_analysis: true
  code_generation: true
  document_creation: true
  data_visualization: true
  
# External tool integration (Manus AI feature)
external_tools:
  web_browser:
    enabled: true
    headless: false
    automation: true
    
  code_editor:
    enabled: true
    languages: ["python", "javascript", "typescript", "java", "cpp"]
    linting: true
    testing: true
    
  database:
    enabled: true
    types: ["sqlite", "postgresql", "mysql", "mongodb"]
    query_optimization: true
    
  api_integration:
    enabled: true
    rate_limiting: true
    authentication: true

# LLM Configuration
llm:
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 4000
  timeout: 60
  
# Logging and monitoring
logging:
  level: "INFO"
  file: "automation_agent.log"
  max_size_mb: 100
  backup_count: 5
  
monitoring:
  metrics_enabled: true
  performance_tracking: true
  error_reporting: true

# Security settings
security:
  sandbox_mode: true
  allowed_domains: []
  blocked_domains: []
  file_access_restrictions: true
  network_restrictions: false

# Integration settings
integrations:
  github:
    enabled: false
    token: ""
    
  slack:
    enabled: false
    webhook_url: ""
    
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""