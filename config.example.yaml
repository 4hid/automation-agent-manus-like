# Automation Agent Configuration

agent:
  # Autonomous operation settings
  autonomous_mode: true
  max_iterations: 30
  error_recovery: true
  retry_attempts: 3
  
  # Quality assurance settings
  verification_enabled: true
  validation_threshold: 0.8
  
  # Memory and performance settings
  max_memory_tokens: 8000
  conversation_truncation: true
  parallel_execution: false

# Tool-specific configurations
tools:
  research:
    max_sources: 10
    fact_check: true
    search_engines: ["google", "bing", "duckduckgo"]
    max_depth: 3
    
  content_creation:
    output_format: "markdown"
    include_citations: true
    grammar_check: true
    plagiarism_check: false
    
  task_planner:
    max_subtasks: 50
    dependency_analysis: true
    resource_estimation: true
    timeline_generation: true
    
  workflow_orchestrator:
    parallel_tasks: 3
    timeout_minutes: 60
    checkpoint_frequency: 5
    rollback_enabled: true
    
  verification:
    automated_testing: true
    quality_metrics: true
    performance_benchmarks: false
    security_scan: false

# LLM Configuration
llm:
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 4000
  timeout: 60
  
# Logging and monitoring
logging:
  level: "INFO"
  file: "automation_agent.log"
  max_size_mb: 100
  backup_count: 5
  
monitoring:
  metrics_enabled: true
  performance_tracking: true
  error_reporting: true

# Security settings
security:
  sandbox_mode: true
  allowed_domains: []
  blocked_domains: []
  file_access_restrictions: true
  network_restrictions: false

# Integration settings
integrations:
  github:
    enabled: false
    token: ""
    
  slack:
    enabled: false
    webhook_url: ""
    
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""